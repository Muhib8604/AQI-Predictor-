name: Hourly Feature Pipeline

on:
  schedule:
    - cron: "0 * * * *"   # every hour, on the hour (UTC)
  workflow_dispatch:        # allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev krb5-user

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run hourly feature pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          AQICN_API_KEY: ${{ secrets.AQICN_API_KEY }}
        run: python feature_pipeline.py

      - name: Commit updated local AQI history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add aqi_history.json

          if git diff --staged --quiet; then
            echo "No history changes to commit."
            exit 0
          fi

          git commit -m "Update AQI lag history [automated]"

          # Remote may have new commits — rebase then push
          git pull --rebase origin main
          git push origin main